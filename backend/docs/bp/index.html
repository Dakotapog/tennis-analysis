<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando combo...</title>
<style>
  body {
    background: #1a1a2e; color: #eee; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
    text-align: center;
  }
  .spinner {
    width: 50px; height: 50px; border: 4px solid #333;
    border-top: 4px solid #00d4aa; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #00d4aa; margin-bottom: 10px; }
  p { color: #888; font-size: 14px; }
  .fallback { display: none; margin-top: 30px; }
  .fallback a {
    display: inline-block; padding: 16px 32px; background: #00d4aa;
    color: #000; text-decoration: none; border-radius: 10px;
    font-size: 18px; font-weight: bold;
  }
  .fallback a:active { background: #00b894; }
  .error { color: #ff6b6b; display: none; margin-top: 20px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>Cargando combo en Betplay...</h2>
  <p>Redirigiendo automaticamente</p>
</div>

<div id="fallback" class="fallback">
  <p>Si no se abrio automaticamente:</p>
  <a id="manual-link" href="#">ABRIR COMBO EN BETPLAY</a>
</div>

<div id="error" class="error">
  <p>Link invalido. Genera combos frescos con betplay_combo_builder.py</p>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var ids = params.get('ids');

  if (!ids || !/^[\d,]+$/.test(ids)) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    return;
  }

  var betplayUrl = 'https://betplay.com.co/apuestas#home?coupon=combination|' + ids + '||append';

  // Set fallback button
  document.getElementById('manual-link').href = betplayUrl;

  // Try auto-redirect
  try {
    window.location.replace(betplayUrl);
  } catch(e) {}

  // If still here after 1.5s, show fallback button (WebView blocked redirect)
  setTimeout(function() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('fallback').style.display = 'block';
  }, 1500);
})();
</script>

</body>
</html>
