<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando combo...</title>
<style>
  body {
    background: #1a1a2e; color: #eee; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
    text-align: center;
  }
  h2 { color: #00d4aa; margin-bottom: 10px; }
  p { color: #888; font-size: 14px; margin: 8px 0; }
  .btn {
    display: inline-block; padding: 20px 40px; background: #00d4aa;
    color: #000; text-decoration: none; border-radius: 12px;
    font-size: 20px; font-weight: bold; margin-top: 24px;
  }
  .btn:active { background: #00b894; }
  .legs { color: #ccc; font-size: 13px; margin-top: 12px; line-height: 1.6; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>

<div id="content">
  <h2 id="title">Combo Betplay</h2>
  <p id="desc"></p>
  <a id="btn" class="btn" href="#" target="_blank">APOSTAR EN BETPLAY</a>
  <div id="legs" class="legs"></div>
</div>

<div id="error" style="display:none">
  <p class="error">Link invalido. Genera combos frescos con betplay_combo_builder.py</p>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var ids    = params.get('ids');
  var label  = params.get('label') || '';

  if (!ids || !/^[\d,]+$/.test(ids)) {
    document.getElementById('content').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    return;
  }

  var idArr = ids.split(',');
  var n = idArr.length;
  var couponPart = idArr.map(function(id) { return id + '|ML'; }).join('/');
  var betplayUrl = 'https://betplay.com.co/apuestas#home?coupon=combination|' + couponPart + '||replace';

  document.getElementById('title').textContent = 'Combo ' + n + ' piernas';
  document.getElementById('desc').textContent  = label || ('IDs: ' + ids);
  document.getElementById('btn').href          = betplayUrl;
  // target="_blank" → nueva pestaña → Betplay limpio siempre
})();
</script>

</body>
</html>
